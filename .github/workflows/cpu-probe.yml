name: cpu-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user >/dev/null
          out=probe.txt; : > $out
          for v in 25.8.10.7-lts 26.3.9.8-lts 26.8.30.8-lts; do
            n=${v%-lts}
            curl -sSLf -o c.tgz https://github.com/ClickHouse/ClickHouse/releases/download/v$v/clickhouse-common-static-$n-amd64.tgz || { echo "$v download failed" >> $out; continue; }
            tar xzf c.tgz; b=$(find . -type f -name clickhouse -path "*usr/bin*" | head -1); echo "$v bin=$b" >> $out
            for cpu in Westmere IvyBridge Haswell; do
              r=$(timeout 120 qemu-x86_64 -cpu $cpu $b local -q 'SELECT 1' 2>&1 | tail -1); echo "$v $cpu => $? $r" >> $out
            done
            rm -rf c.tgz clickhouse-common-static-*
          done
          cat $out
          echo "::notice title=probe::$(paste -sd'|' $out)"
